name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Xcode Archive (Unsigned)
        run: |
          xcodebuild archive \
            -project FlashlightApp.xcodeproj \
            -scheme FlashlightApp \
            -sdk iphoneos \
            -archivePath build/FlashlightApp.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package .app into .ipa
        run: |
          mkdir -p Payload
          cp -r build/FlashlightApp.xcarchive/Products/Applications/FlashlightApp.app Payload/
          zip -r FlashlightApp.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlashlightApp-Unsigned
          path: FlashlightApp.ipa
